{% extends "base.html" %}
{% block title %}Crear cuenta — DevPlay{% endblock %}
{% block content_public %}
<div style="max-width:470px;margin:2.5rem auto 0;">
  <div class="glass-card frame-double card-pad" style="padding:2rem;">
    <div style="text-align:center;margin-bottom:1.4rem;">
      <span class="logo-badge" style="width:3.4rem;height:3.4rem;font-size:1.6rem;margin:0 auto 0.8rem;">D</span>
      <h1 class="text-section">Únete a DevPlay</h1>
      <p class="text-meta">Publica betas, consigue testers, haz amigos devs 🎮</p>
    </div>
    <div class="rule-ornate" style="margin-bottom:1.2rem;">✦</div>
    <form method="post">
      <div class="field">
        <label for="full_name">Nombre completo</label>
        <input class="input" id="full_name" name="full_name" placeholder="Ej: Diego Núñez" maxlength="60">
      </div>
      <div class="field">
        <label for="email">Correo</label>
        <input class="input" id="email" name="email" type="email" required placeholder="tucorreo@ejemplo.com">
      </div>
      <div class="field">
        <label for="username">Usuario</label>
        <input class="input" id="username" name="username" required pattern="[a-z0-9_]{3,20}" placeholder="min 3 letras, sin espacios (ej: nube42)">
        <span class="hint">Así te verán los demás: @usuario</span>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input class="input" id="password" name="password" type="password" required minlength="6" placeholder="Mínimo 6 caracteres">
      </div>
      <div class="field">
        <label for="age">Edad</label>
        <input class="input" id="age" name="age" type="number" min="13" max="120" required placeholder="13+">
      </div>
      <label class="checkbox-row" style="margin:.4rem 0 1rem;">
        <input type="checkbox" name="mayor13" value="1">
        <span>Confirmo que tengo <b>13 años o más</b> y acepto el trato justo de la comunidad (Ley 1581, Art. 7 — tratamiento de datos)</span>
      </label>
      <button class="btn btn-primary btn-press" style="width:100%;">Crear mi cuenta 🚀</button>
    </form>
    <p class="text-meta" style="text-align:center;margin-top:1.2rem;">
      ¿Ya tienes cuenta? <a href="{{ url_for('login') }}" style="color:var(--primary);font-weight:700;">Entra aquí</a>
    </p>
  </div>
</div>
{% endblock %}

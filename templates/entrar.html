{% extends "base.html" %}
{% block title %}Entrar — DevPlay{% endblock %}
{% block content_public %}
<div style="max-width:430px;margin:2.5rem auto 0;">
  <div class="glass-card frame-double card-pad" style="padding:2rem;">
    <div style="text-align:center;margin-bottom:1.4rem;">
      <span class="logo-badge" style="width:3.4rem;height:3.4rem;font-size:1.6rem;margin:0 auto 0.8rem;">D</span>
      <h1 class="text-section">DevPlay</h1>
      <p class="text-meta">La gaceta de los devs indie de Latinoamérica 🎮</p>
    </div>
    <div class="rule-ornate" style="margin-bottom:1.2rem;">✦</div>
    <form method="post">
      <div class="field">
        <label for="ident">Correo o usuario</label>
        <input class="input" id="ident" name="ident" required autofocus placeholder="tucorreo@ejemplo.com">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input class="input" id="password" name="password" type="password" required placeholder="••••••••">
      </div>
      <button class="btn btn-primary btn-press" style="width:100%;margin-top:.4rem;">Entrar 🚪</button>
    </form>
    <p class="text-meta" style="text-align:center;margin-top:1.2rem;">
      ¿Aún no tienes cuenta? <a href="{{ url_for('registro') }}" style="color:var(--primary);font-weight:700;">Crea una gratis</a>
    </p>
  </div>
  <p class="text-tiny" style="text-align:center;margin-top:1rem;">
    Demo de presentación — entradas: <b>nube42@devplay.test</b> / <b>test1234</b>
  </p>
</div>
{% endblock %}
